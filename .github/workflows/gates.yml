# The platform's own gates, run on GitHub — the second caller of the gates the
# .githooks/ hooks run locally (ADR-055).
#
# ⚠️ This workflow exists for one path only: a pull request merged in the browser.
# Every other gate on this platform is a local git hook, and a merge performed on
# github.com runs no hook at all — so before this file, a Dependabot pull request
# merged with the green button reached main having passed nothing (RISK_REGISTER R63).
# `required_status_checks` on main names the `gates` job below, which is why the job
# id must not be renamed: the branch protection rule on all sixteen repositories
# refers to it by that exact string.
#
# ⚠️ YAML forbids tabs. The workspace-wide "indentation is tabs" rule is enforced by
# eslint and prettier over JavaScript and TypeScript — it cannot apply here.
#
# ⚠️ Every `uses:` is pinned to a commit SHA, not a tag: Scorecard's
# Pinned-Dependencies check grades this file too, and a tag is mutable.
#
# Six of the eight pre-push gates run here, in the hook's own order. The two that
# do not:
#
#   Qodana    — needs a JetBrains Cloud token this repository does not hold. It stays
#               a local-only gate; the hook is still the only place it runs.
#   scorecard — has its own workflow (scorecard.yml) and grades the repository rather
#               than a diff, so running it per pull request would say nothing new.
#
# ⚠️ And one gate runs here in a weaker form, in ten of the fourteen packages. In the
# nine backend services `yarn test:cov` runs two vitest projects, and the `integration`
# one is not hermetic: it needs the platform's MongoDB replica set with the MONGO_TEST_*
# users provisioned, its Redis with the ACL that grants the `marketplaceDev:itest:`
# namespace, and the sibling marketplace-db-setup checkout, whose migrations its
# globalSetup replays to get the real $jsonSchema validators. None of the three exists on
# a runner, and the credentials are read from a file that is never committed.
# marketplace-db-setup is the tenth, for the same reason in a different shape:
# test/migrations.test.mjs replays the real migrations against the real replica set and
# skips itself when there is none, which leaves the suite green and the report twenty
# statements and six functions short. So a package that cannot measure coverage on a
# runner declares the hermetic subset as `test:unit`, this job runs that instead, and the
# 100%-on-four-metrics coverage gate stays local, where the datastores are. Everywhere
# else `yarn test:cov` runs in full. The mutation gate needed the same treatment one step
# later: db-setup's `mutate` covers migrations/**, which migrate-mongo replays against a
# real database or not at all, so 60 of its 943 mutants came back survived and the gate
# read 85.68 against a break threshold of 100. A package in that position declares
# `test:mutation:ci` — the same config with the database-only patterns dropped — and that
# is what runs here. ADR-055 §Risks records both residues; they are the part of R63 this
# workflow does not close.
name: Gates

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    # ⚠️ 120, not 45, and the reason is Gate 7. The first `push: main` run of this
    # workflow was cancelled at exactly 45 minutes in marketplace-admin,
    # marketplace-shopowner and marketplace-user, with every gate ahead of mutation
    # green — and an exceeded `timeout-minutes` reports as `cancelled`, never as
    # `failure`, which reads like somebody pressed a button rather than like a budget
    # running out. A shared runner is several times slower at Stryker than the
    # workstation the local pre-push figures come from, and mutation is the gate
    # ADR-055 §4 deliberately kept in CI rather than leaving hook-only. This stays a
    # cap and not a removal: a hung job still dies, it does not run for six hours.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # ⚠️ No `cache: yarn`, deliberately. This workflow runs on pull requests from
      # anywhere, and a dependency cache is state one pull request writes and the next
      # reads — the one input to a security gate that a contributor could choose.
      # A cold install costs well under a minute; the gates below cost minutes.

      # packageManager pins yarn 1.22.22 in every package.json; corepack is what
      # honours it, so the runner uses the same yarn the hooks do.
      - name: Enable corepack
        run: corepack enable

      # --frozen-lockfile is the point: an install that may rewrite yarn.lock proves
      # nothing about the lockfile under review. The committed lockfile carries
      # registry.npmjs.org URLs (scripts/lockfile-registry-filter.sh rewrites the
      # local proxy out on the way into git), so this resolves from the public
      # registry with no configuration.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Not every package declares every script: marketplace-db-setup has neither
      # eslint nor prettier nor TypeScript by design (ADR-024, its content is applied
      # migrations). Reading package.json keeps this file byte-identical across all
      # fourteen packages instead of forking it per repository.
      - name: Which gates does this package declare
        id: scripts
        run: |
          has() { node -p "Boolean(require('./package.json').scripts['$1'])"; }
          # A package that cannot measure coverage on a runner declares the hermetic subset
          # as `test:unit`, and that declaration is what is read here — not a list of service
          # names, and not a grep of the vitest config. The grep came first and was wrong:
          # marketplace-db-setup's config is `vitest.config.mjs` and names no projects at all,
          # so `name: 'integration'` in `vitest.config.mts` matched nothing and put its coverage
          # gate on a runner with no MongoDB, twenty statements short of its own threshold.
          if [ "$(has test:unit)" = true ]; then
            coverage=unit
          else
            coverage=full
          fi
          # The mutation gate has the same shape and needed it one gate later. A package whose
          # mutants cannot all be killed without a datastore declares `test:mutation:ci`, and that
          # is what runs. Only marketplace-db-setup declares one: only its `mutate` covers files a
          # real database replays, because the nine services already point Stryker at a unit-only
          # vitest config, so nothing of theirs was ever in this position.
          if [ "$(has test:mutation:ci)" = true ]; then
            mutation=ci
          elif [ "$(has test:mutation)" = true ]; then
            mutation=full
          else
            mutation=none
          fi
          {
            echo "lint=$(has lint:check)"
            echo "typecheck=$(has typecheck)"
            echo "mutation=$mutation"
            echo "coverage=$coverage"
          } >> "$GITHUB_OUTPUT"

      - name: Gate 1 - SAST (yarn semgrep:ci)
        run: yarn semgrep:ci

      # The hook's trivy invocation, flag for flag. --skip-dirs .stryker-tmp is
      # load-bearing there and harmless here; the named db cache volume is not
      # reproduced because a runner is thrown away after every job.
      - name: Gate 2 - dependency advisories (trivy)
        run: |
          docker run --rm \
            -v "$PWD":/src:ro \
            aquasec/trivy:0.70.0 fs \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln \
            --skip-dirs node_modules \
            --skip-dirs .stryker-tmp \
            --skip-dirs .qodana \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-version-check \
            /src

      - name: Gate 4 - lint and formatting (yarn lint:check)
        if: steps.scripts.outputs.lint == 'true'
        run: yarn lint:check

      - name: Gate 5 - types (yarn typecheck)
        if: steps.scripts.outputs.typecheck == 'true'
        run: yarn typecheck

      - name: Gate 6 - coverage, 100% on every metric (yarn test:cov)
        if: steps.scripts.outputs.coverage == 'full'
        run: yarn test:cov

      # The nine services and marketplace-db-setup, and not a lowered threshold — a
      # different gate, named
      # as such. The coverage threshold is untouched and the hook still enforces it.
      - name: Gate 6 - unit suite, no coverage gate (yarn test:unit)
        if: steps.scripts.outputs.coverage == 'unit'
        run: yarn test:unit

      - name: Gate 7 - mutation score 100 (yarn test:mutation)
        if: steps.scripts.outputs.mutation == 'full'
        run: yarn test:mutation

      # marketplace-db-setup only: 582 of its 943 mutants, the ones whose killers do not
      # need MongoDB. The break threshold is still 100 and nothing is excused — the
      # database-only patterns are dropped from `mutate`, and `.githooks/pre-push` still
      # runs the full config against the replica set the workstation has.
      - name: Gate 7 - mutation score 100 on the hermetic subset (yarn test:mutation:ci)
        if: steps.scripts.outputs.mutation == 'ci'
        run: yarn test:mutation:ci
