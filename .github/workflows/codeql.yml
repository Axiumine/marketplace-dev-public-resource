# CodeQL — the only static-analysis tool OpenSSF Scorecard's SAST check actually
# recognises for TypeScript.
#
# ⚠️ This does NOT replace the semgrep gate in .githooks/pre-push. Scorecard's SAST
# check matches tool names, never scan results: it looks for the literal
# `github/codeql-action/analyze` step (or sonar/snyk/pysa/qodana/hadolint), and has no
# entry for semgrep and no "a SARIF was uploaded" path at all. The vendored semgrep
# rules keep running locally before every push, where they always ran; this workflow
# exists alongside them, for the bug classes CodeQL's dataflow engine reaches and a
# pattern matcher does not.
#
# ⚠️ Pinned to commit SHAs. Scorecard's Pinned-Dependencies check grades this file.
#
# ⚠️ YAML forbids tabs — see the note in scorecard.yml.
name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 2 * * 6'

permissions: read-all

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:javascript-typescript'
