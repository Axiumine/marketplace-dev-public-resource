# Project-specific Semgrep rules for marketplace-dev-public-resource.
#
# Registry packs (p/typescript, p/javascript, p/nodejs, p/secrets) are passed
# on the command line by the `semgrep` / `semgrep:ci` yarn scripts. This file
# holds only rules specific to the Marketplace platform's own conventions.
#
# Note: the sinks below are restricted to console / logger / log receivers on
# purpose — matching any `x.y(...)` call gives false positives (e.g. setting a
# cookie or a header whose name contains one of these words).
rules:
  # Opaque access/refresh tokens live in Redis sessions and signed cookies.
  # Logging them defeats the whole point of opaque tokens.
  - id: marketplace-no-log-auth-token
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Possible logging of an access/refresh token. Auth tokens must not be written to logs (see CLAUDE.md — opaque tokens + Redis sessions).
    metadata:
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $ARG, ...)
          - patterns:
              - pattern: $L.$M(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: (?i)^(logger|log)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)(accesstoken|access_token|refreshtoken|refresh_token|bearer)

  # This is the ONE tier that is reachable unauthenticated, and the reset-password
  # flow is deliberately built so that no response distinguishes a registered
  # address from an unknown one. Logging the reset hash — or the address it was
  # issued for — puts that secret, and the enumeration signal, into the log file.
  - id: marketplace-no-log-reset-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Do not log the password-reset hash or the address it was issued for. The hash authenticates the reset link, and logging the pair reintroduces the account-enumeration oracle the flow was written to close.
    metadata:
      category: security
      confidence: MEDIUM
      references:
        - src/lib/access/resetPwdFlow.mts
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $ARG, ...)
          - patterns:
              - pattern: $L.$M(..., $ARG, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: (?i)^(logger|log)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i)(resethash|reset_hash|resetpwd|resetdatereq)
